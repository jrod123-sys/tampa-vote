<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee4">
  <meta name="robots" content="noindex">
  <title>Tampa Tour Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --bg: #f3eee4;
      --bg-2: #e9e1d2;
      --ink: #1c1814;
      --muted: #6d6458;
      --card: #fffcf7;
      --line: #e2dacd;
      --accent: #1b6b61;
      --accent-dark: #14544c;
      --accent-soft: #e1f0ed;
      --liked: #1b6b61;
      --fine: #b86a1a;
      --fine-soft: #f8ead8;
      --didnt: #b42318;
      --didnt-soft: #f8e2df;
      --split: #9a5b12;
      --shadow: 0 1px 2px rgba(28, 24, 20, .06), 0 8px 24px rgba(28, 24, 20, .06);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --tab-h: 64px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: Outfit, "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 400px at 10% -10%, #efe4c8 0%, transparent 50%),
        radial-gradient(700px 360px at 110% 0%, #dceae6 0%, transparent 46%),
        var(--bg);
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(18px + var(--safe-t)) 18px calc(var(--tab-h) + var(--safe-b) + 20px);
    }
    header.top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    header.top h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 650;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }
    header.top .count-pill {
      font-size: .78rem;
      font-weight: 600;
      color: var(--accent-dark);
      background: var(--accent-soft);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .intro { padding: 28px 22px 22px; }
    .intro .eyebrow {
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: .7rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .intro h2 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 650;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .intro p { color: var(--muted); font-size: .98rem; }
    .intro p + p { margin-top: 8px; }
    .primary, .secondary, .ghost, .danger {
      display: block;
      width: 100%;
      text-align: center;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 600;
      font-size: 1rem;
      transition: transform .12s ease, background .12s ease, opacity .12s ease;
    }
    .primary { background: var(--accent); color: #fff; margin-top: 22px; }
    .primary:active, .secondary:active, .tier:active, .choice:active { transform: scale(.98); }
    .primary:disabled, .secondary:disabled { opacity: .5; cursor: default; transform: none; }
    .secondary {
      background: var(--ink);
      color: #fff;
      margin-top: 12px;
    }
    .ghost {
      color: var(--muted);
      margin-top: 8px;
      font-weight: 500;
    }
    .danger { color: var(--didnt); margin-top: 8px; font-weight: 600; }
    .code-box {
      margin-top: 22px;
      padding: 14px 16px;
      background: #f6f1e8;
      border-radius: 14px;
      border: 1px dashed #d3c9b8;
    }
    .code-box label {
      display: block;
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .code-row strong {
      font-family: Outfit, monospace;
      letter-spacing: .08em;
      font-size: 1.02rem;
    }
    .code-row button {
      font-size: .82rem;
      font-weight: 600;
      color: var(--accent-dark);
      padding: 6px 10px;
      background: var(--accent-soft);
      border-radius: 8px;
    }
    .hint { margin-top: 8px; font-size: .8rem; color: var(--muted); }

    .progress-wrap { margin-bottom: 16px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .bar {
      height: 6px;
      background: var(--bg-2);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar > span {

      height: 100%;

    .place-name {

      font-size: 1.85rem;

    .prompt { color: var(--muted); margin-bottom: 20px; }
    .tiers { display: flex; flex-direction: column; gap: 10px; }
    .tier {

      background: #fff;
      border-radius: 16px;
      padding: 15px 16px;
      font-weight: 650;
      font-size: 1.05rem;

    .tier.liked { border-color: var(--liked); color: var(--liked); background: var(--accent-soft); }
    .tier.fine { border-color: var(--fine); color: var(--fine); background: var(--fine-soft); }
    .tier.didnt { border-color: var(--didnt); color: var(--didnt); background: var(--didnt-soft); }
    .deal {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 4px 4px;
      text-align: left;
      color: var(--ink);
      font-size: .92rem;

    .deal input {
      width: 18px;
      height: 18px;
      accent-color: var(--didnt);

    .deal span { color: var(--muted); font-size: .8rem; display: block; font-weight: 400; }
    .nav-row {

      gap: 10px;
      margin-top: 10px;

    .nav-row .ghost { flex: 1; }

    .vs {
      font-family: Fraunces, Georgia, serif;
      font-style: italic;
      color: var(--muted);
      margin: 6px 0;
      font-size: .95rem;
    }
    .choice {
      display: block;
      width: 100%;
      text-align: center;
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 22px 16px;
      font-family: Fraunces, Georgia, serif;
      font-weight: 650;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .choice:hover { border-color: var(--accent); }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .place {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;

    .place .n {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--muted);
    }
    .place h3 {
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .meta {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }
    .score {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }
    .badge {
      display: inline-block;
      font-size: .68rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 2px 7px;
      border-radius: 99px;

    .badge.liked { background: var(--accent-soft); color: var(--accent-dark); }
    .badge.fine { background: var(--fine-soft); color: var(--fine); }
    .badge.didnt { background: var(--didnt-soft); color: var(--didnt); }
    .badge.agreed { background: var(--accent-soft); color: var(--accent-dark); }
    .badge.split { background: var(--fine-soft); color: var(--split); }
    .badge.db { background: var(--didnt-soft); color: var(--didnt); }

    .empty {
      padding: 36px 22px;
      text-align: center;
    }
    .empty h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .empty p { color: var(--muted); }

    .lock-card { padding: 32px 22px; text-align: center; }
    .lock-card h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.55rem;
      margin: 8px 0 8px;
    }
    .lock-card p { color: var(--muted); }
    .big-count {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 2.6rem;
      letter-spacing: -0.04em;
      color: var(--accent-dark);

    .lock-card .bar { margin: 18px auto 8px; max-width: 220px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 4px 2px 12px;
    }
    .section-head h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
    }
    .section-head p { font-size: .8rem; color: var(--muted); }

    nav.tabs {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: rgba(243, 238, 228, .92);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 6px 10px var(--safe-b);
      display: flex;
      justify-content: center;
      z-index: 20;
    }
    nav.tabs .inner {
      width: 100%;
      max-width: 430px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }
    nav.tabs button {
      padding: 10px 8px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: .82rem;
      color: var(--muted);
    }
    nav.tabs button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(28,24,20,.08);
    }
    nav.tabs button .ic { display: block; font-size: 1.05rem; margin-bottom: 1px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tab-h) + var(--safe-b) + 12px);
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: .88rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 40;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(28, 24, 20, .4);
      z-index: 30;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-radius: 22px 22px 0 0;
      padding: 22px 20px calc(18px + var(--safe-b));
      box-shadow: var(--shadow);
    }
    .modal h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .modal p { color: var(--muted); font-size: .92rem; margin-bottom: 14px; }
    .modal input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 16px;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .modal input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .hidden { display: none !important; }
    .err { color: var(--didnt); font-size: .88rem; margin-top: 8px; }
    .footnotes { margin-top: 16px; text-align: center; }
    .footnotes button { color: var(--muted); font-size: .85rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  
    .demo-banner {
      position: sticky;
      top: 0;
      z-index: 25;
      margin: calc(-18px - var(--safe-t)) -18px 16px;
      padding: calc(8px + var(--safe-t)) 14px 8px;
      background: #8a4b12;
      color: #fff8ee;
      text-align: center;
      font-weight: 650;
      font-size: .76rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .demo-banner strong { font-weight: 700; letter-spacing: .12em; }
    .demo-sub {
      display: block;
      margin-top: 2px;
      font-weight: 500;
      letter-spacing: .02em;
      text-transform: none;
      font-size: .72rem;
      opacity: .92;

    body.demo { }

      display: flex;
      flex-direction: column;
      align-items: flex-start;

    .place .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 10px;
      align-items: center;

    }
    .place-card .body { padding: 12px 14px 14px; }

      font-size: 1.12rem;
      letter-spacing: -0.02em;

    const CLIENT_KEY = 'tampa-vote-v2-client';
    const FAILS_KEY = 'tampa-vote-v2-fails';
    const LOCK_KEY = 'tampa-vote-v2-locked-until';
    const LOCK_MS = 60 * 60 * 1000;
    const VALID_CODES = ['KT', 'MB', 'RZ', 'JW'];

    const app = document.getElementById('app');
    const tabs = document.getElementById('tabs');

    const state = {
      phase: 'boot', // boot | claim | claimed | enter | app
      tab: 'vote',   // vote | mine | group
      screen: 'home', // home | rate | compare
      code: '',
      clientKey: '',
      remaining: null,
      myList: [],
      group: [],
      editing: null,
      ratePlace: null,
      rateTier: null,
      rateDeal: false,
      compare: null,
      compareProgress: { done: 0, total: 0 },
      enterValue: '',
      enterError: '',
      fails: 0,
      lockedUntil: 0,
      busy: false,
      bootError: '',
    };

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtScore(n) {
      if (n == null || n === '') return '';
      const x = Number(n);
      if (!Number.isFinite(x)) return '';
      const s = x.toFixed(2);
      return s.endsWith('0') ? (s.endsWith('00') ? String(Math.round(x)) : s.slice(0, -1)) : s;
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2600);
    }
    function normalizeCode(s) {
      return String(s || '').trim().toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
    }
    function isLocked() {
      return Date.now() < (state.lockedUntil || 0);
    }
    function persistLock() {
      localStorage.setItem(FAILS_KEY, String(state.fails));
      localStorage.setItem(LOCK_KEY, String(state.lockedUntil || 0));
    }
    function recordFail(serverLocked) {
      state.fails = (state.fails || 0) + 1;
      if (serverLocked || state.fails >= 5) {
        state.fails = Math.max(state.fails, 5);
        state.lockedUntil = Date.now() + LOCK_MS;
      }
      persistLock();
    }
    function clearFails() {
      state.fails = 0;
      state.lockedUntil = 0;
      persistLock();
    }
    function saveCode(code) {
      state.code = normalizeCode(code);
      localStorage.setItem(CODE_KEY, state.code);
    }
    function clientKey() {
      let k = localStorage.getItem(CLIENT_KEY);
      if (!k) {
        k = (crypto.randomUUID && crypto.randomUUID()) || ('k' + Math.random().toString(36).slice(2) + Date.now());
        localStorage.setItem(CLIENT_KEY, k);
      }
      return k;
    }
    function isFail(data) {
      return data && typeof data === 'object' && !Array.isArray(data) && data.ok === false;
    }
    function rpcMessage(err) {
      if (!err) return 'Something went wrong.';
      if (typeof err === 'string') return err;
      return err.message || err.error || err.details || 'Something went wrong.';
    }

    async function api(fn, args) {
      const { data, error } = await sb.rpc(fn, args || {});
      if (error) {
        const e = new Error(error.message || 'Request failed');
        e.cause = error;
        throw e;
      }
      return data;
    }

    async function handleAuthResult(data) {
      if (!isFail(data)) return data;
      if (data.locked) {
        state.lockedUntil = Date.now() + LOCK_MS;
        persistLock();
        state.enterError = data.error || 'Too many wrong codes. Please wait an hour and try again.';
        state.phase = state.code ? state.phase : 'enter';
        if (!state.code) state.phase = 'enter';
      }
      return data;
    }

    async function refreshMine() {
      if (!state.code) return;
      const data = await api('get_my_list', { voter_code: state.code, client_key: state.clientKey });
      if (isFail(data)) {
        if (data.locked) {
          state.lockedUntil = Date.now() + LOCK_MS;
          persistLock();
        }
        throw new Error(data.error || 'Could not load your list.');
      }
      state.myList = Array.isArray(data) ? data.slice().sort((a, b) => a.rank - b.rank) : [];
    }

    async function refreshGroup() {
      const data = await api('get_group_rank');
      state.group = Array.isArray(data) ? data : [];
    }

    async function submitList(list) {
      const rankings = list.map((item, i) => ({
        property: item.property,
        tier: item.tier,
        deal_breaker: !!item.deal_breaker,
        rank: i + 1,
      }));
      const data = await api('submit_ranking', {
        voter_code: state.code,
        rankings,
        client_key: state.clientKey,
      });
      if (isFail(data)) {
        if (data.locked) {
          state.lockedUntil = Date.now() + LOCK_MS;
          persistLock();
        }
        throw new Error(data.error || 'Could not save your list.');
      }
      state.myList = Array.isArray(data) ? data.slice().sort((a, b) => a.rank - b.rank) : [];
      return state.myList;
    }

    function mineByName(name) {
      return state.myList.find((r) => r.property === name) || null;
    }

    function bandOf(list, tier, except) {
      return list
        .filter((r) => r.tier === tier && r.property !== except)
        .sort((a, b) => a.rank - b.rank);
    }

    function askPrefer(aName, bName) {
      return new Promise((resolve) => {
        state.compare = { a: aName, b: bName, resolve };
        state.screen = 'compare';
        render();
      });
    }

    async function insertIntoBand(item, band) {
      if (band.length === 0) return [item];
      let lo = 0, hi = band.length;
      const total = Math.max(1, Math.ceil(Math.log2(band.length + 1)));
      state.compareProgress = { done: 0, total };
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        const preferNew = await askPrefer(item.property, band[mid].property);
        state.compareProgress.done++;
        if (preferNew) hi = mid;
        else lo = mid + 1;
      }
      const out = band.slice();
      out.splice(lo, 0, item);
      return out;
    }

    function stitch(existing, newBand, tier, place) {
      const rest = existing.filter((r) => r.property !== place);
      const liked = tier === 'liked' ? newBand : bandOf(rest, 'liked');
      const fine = tier === 'fine' ? newBand : bandOf(rest, 'fine');
      const didnt = tier === 'didnt_like' ? newBand : bandOf(rest, 'didnt_like');
      return [...liked, ...fine, ...didnt];
    }

    function viewLink(name) {
      const p = BY_NAME[name];
      if (!p) return '';
      return `<a class="view-link" href="${esc(p.url)}" target="_blank" rel="noopener">View listing <span aria-hidden="true">↗</span></a>`;
    }
    function pill() {
      return state.code ? `<span class="count-pill">Code ${esc(state.code)}</span>` : '';
    }

    function renderClaim() {
      return `
        <header class="top"><h1>Tampa Tour Vote</h1></header>
        <div class="card intro">
          <div class="eyebrow">Four private codes</div>
          <h2>Get your voting code.</h2>
          <p>Tap Start voting and we'll give you a 2-letter code. Remember it — you'll need it if you switch phones. Your list stays private to that code.</p>
          <button class="primary" data-act="do-claim" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Assigning…' : 'Start voting'}</button>
          <p class="already"><button type="button" data-act="go-enter">Already have a code? Enter it</button></p>
        </div>`;
    }

    function renderClaimed() {
      return `
        <header class="top"><h1>Tampa Tour Vote</h1></header>
        <div class="card intro" style="text-align:center">
          <div class="eyebrow">Your private code</div>
          <p class="your-code-is">Your code is</p>
          <div class="code-hero">${esc(state.code)}</div>
          <h2 style="margin-bottom:8px">Remember it.</h2>
          <p>You'll need <strong>${esc(state.code)}</strong> if you switch phones. We won't be able to show it again from a new device.</p>
          <button class="primary" data-act="go-home" style="margin-top:18px">Continue</button>
          <button class="ghost" data-act="copy">Copy code</button>
        </div>`;
    }

    function renderEnter() {
      const locked = isLocked();
      const err = locked
        ? 'Too many wrong codes. Please wait an hour and try again.'
        : state.enterError;
      return `
        <header class="top"><h1>Tampa Tour Vote</h1></header>
        <div class="card intro" style="text-align:center">
          <div class="eyebrow">${state.remaining === 0 ? 'All 4 codes are taken' : 'Restore your code'}</div>
          <h2>Enter your 2-letter code</h2>
          <p>If you already started on another phone, type the code you were given.</p>
          <input class="code-input" id="code-in" maxlength="2" autocomplete="off" spellcheck="false" inputmode="text"
            placeholder="XX" value="${esc(state.enterValue)}" ${locked || state.busy ? 'disabled' : ''} aria-label="Your 2-letter code">
          ${err ? `<p class="err">${esc(err)}</p>` : ''}
          <button class="primary" data-act="submit-enter" ${locked || state.busy ? 'disabled' : ''}>${state.busy ? 'Checking…' : 'Continue'}</button>
          ${state.remaining > 0 ? `<p class="already"><button type="button" data-act="go-claim">Get a new code instead</button></p>` : ''}
        </div>`;
    }

    function renderHome() {
      return `
        <header class="top"><h1>Tampa Tour Vote</h1>${pill()}</header>
        <div class="section-head">
          <h2>The six places</h2>
          <p>Rate them as you tour · you can add more later</p>
        </div>
        <div class="card-grid">
          ${PROPERTIES.map((p) => {
            const row = mineByName(p.name);
            return `
              <article class="card place-card">
                <img class="photo" src="${esc(p.img)}" alt="${esc(p.name)}">
                <div class="body">
                  <h3>${esc(p.name)}</h3>
                  <div class="cta-row">
                    ${viewLink(p.name)}
                    ${row
                      ? `<span class="rated-chip badge ${esc(row.tier)}">${esc(TIER_LABEL[row.tier])} · ${esc(fmtScore(row.score))}</span>`
                      : `<button class="rate-btn" data-act="rate" data-name="${esc(p.name)}">Rate</button>`}
                  </div>
                </div>
              </article>`;
          }).join('')}
        </div>`;
    }

    function renderRate() {
      const name = state.ratePlace;
      const p = BY_NAME[name];
      if (!p) return renderHome();
      const rated = state.myList.length;
      return `
        <header class="top"><h1>Tampa Tour Vote</h1>${pill()}</header>
        <div class="progress-wrap">
          <div class="progress-meta"><span>How it felt</span><span>${rated} already on your list</span></div>
        </div>
        <div class="card rate-card">
          <img class="photo" src="${esc(p.img)}" alt="${esc(name)}">
          <div class="place-name">${esc(name)}</div>
          <p class="tiny-link">${viewLink(name)}</p>
          <p class="prompt">How did this one feel?</p>
          <div class="tiers">
            <button class="tier ${state.rateTier === 'liked' ? 'liked' : ''}" data-act="pick-tier" data-tier="liked">Liked it</button>
            <button class="tier ${state.rateTier === 'fine' ? 'fine' : ''}" data-act="pick-tier" data-tier="fine">Fine</button>
            <button class="tier ${state.rateTier === 'didnt_like' ? 'didnt' : ''}" data-act="pick-tier" data-tier="didnt_like">Didn't like it</button>
          </div>
          <label class="deal">
            <input type="checkbox" data-act="deal" ${state.rateDeal ? 'checked' : ''}>
            <div>Deal breaker<div><span>I wouldn't live here</span></div></div>
          </label>
          <button class="primary" data-act="next-rate" ${!state.rateTier || state.busy ? 'disabled' : ''}>${state.busy ? 'Saving…' : 'Next'}</button>
          <button class="ghost" data-act="cancel-rate">Back</button>
        </div>`;
    }

    function renderCompare() {
      const c = state.compare;
      if (!c) return renderHome();
      const a = BY_NAME[c.a];
      const b = BY_NAME[c.b];
      const { done, total } = state.compareProgress;
      return `
        <header class="top"><h1>Tampa Tour Vote</h1>${pill()}</header>
        <div class="progress-wrap">
          <div class="progress-meta"><span>Which did you like more?</span><span>${Math.min(done + 1, total)} of ${total}</span></div>
          <div class="bar"><span style="width:${total ? Math.round((done / total) * 100) : 40}%"></span></div>
        </div>
        <div class="card compare-card">
          <p class="prompt">Tap the one you liked more</p>
          <button class="choice" data-act="prefer" data-pick="a">
            <img class="photo-mini" src="${esc(a.img)}" alt="">
            <div class="choice-name">${esc(a.name)}</div>
          </button>
          <div class="vs">or</div>
          <button class="choice" data-act="prefer" data-pick="b">
            <img class="photo-mini" src="${esc(b.img)}" alt="">
            <div class="choice-name">${esc(b.name)}</div>
          </button>
        </div>`;
    }

    function renderMine() {
      const rows = state.myList;
      if (!rows.length) {
        return `
          <header class="top"><h1>My List</h1>${pill()}</header>
          <div class="card intro">
            <h2>Nothing here yet.</h2>
            <p>Rate a place from the Vote tab as you tour. You can add the rest later.</p>
            <button class="primary" data-act="go-vote">Go rate a place</button>
          </div>`;
      }
      return `
        <header class="top"><h1>My List</h1>${pill()}</header>
        <div class="section-head">
          <h2>Your ranking</h2>
          <p>Scores out of 10, private to you · Edit to change a band or order</p>
        </div>
        <div class="list">${rows.map((row) => {
          const p = BY_NAME[row.property];
          const open = state.editing === row.property;
          const idx = rows.indexOf(row);
          const prev = rows[idx - 1];
          const next = rows[idx + 1];
          const canUp = prev && prev.tier === row.tier;
          const canDown = next && next.tier === row.tier;
          return `
          <article class="card place with-photo" style="grid-template-columns: 52px 1fr auto;${open ? 'grid-template-rows: auto auto;' : ''}">
            <img class="thumb" src="${esc(p.img)}" alt="">
            <div>
              <h3>${esc(row.property)}</h3>
              <div class="meta">
                <span class="badge ${esc(row.tier)}">${esc(TIER_LABEL[row.tier])}</span>
                ${row.deal_breaker ? '<span class="badge db">Deal breaker</span>' : ''}
                ${viewLink(row.property)}
              </div>
              ${open ? '' : `<button class="edit-btn" data-act="edit" data-name="${esc(row.property)}">Edit</button>`}
            </div>
            <div class="score">${esc(fmtScore(row.score))}</div>
            ${open ? `
              <div class="edit-panel">
                <div class="tiers-row">
                  <button class="tier ${row.tier==='liked'?'liked':''}" data-act="set-tier" data-tier="liked" data-name="${esc(row.property)}">Liked</button>
                  <button class="tier ${row.tier==='fine'?'fine':''}" data-act="set-tier" data-tier="fine" data-name="${esc(row.property)}">Fine</button>
                  <button class="tier ${row.tier==='didnt_like'?'didnt':''}" data-act="set-tier" data-tier="didnt_like" data-name="${esc(row.property)}">Didn't like</button>
                </div>
                <label class="deal">
                  <input type="checkbox" data-act="edit-deal" data-name="${esc(row.property)}" ${row.deal_breaker ? 'checked' : ''}>
                  <div>Deal breaker</div>
                </label>
                <div class="stepper">
                  <button type="button" data-act="up" data-name="${esc(row.property)}" ${canUp && !state.busy ? '' : 'disabled'}>↑ Move up</button>
                  <button type="button" data-act="down" data-name="${esc(row.property)}" ${canDown && !state.busy ? '' : 'disabled'}>↓ Move down</button>
                </div>
                <button class="ghost" data-act="close-edit" style="margin:0">Done</button>
              </div>` : ''}
          </article>`;
        }).join('')}</div>
        <p class="hint" style="margin-top:14px;text-align:center">Adding another place will ask a couple of “which did you like more?” questions if it lands in a band you already used.</p>`;
    }

    function renderGroup() {
      const rows = state.group || [];
      return `
        <header class="top"><h1>Group Rank</h1>${pill()}</header>
        <div class="section-head">
          <h2>Combined ranking</h2>
          <p>A place unlocks once 2 of you have rated it</p>
        </div>
        ${!rows.length ? `<p class="loading">Loading…</p>` : `<div class="list">${rows.map((r) => {
          const p = BY_NAME[r.property] || { img: '', name: r.property };
          if (!r.unlocked) {
            return `
              <article class="card place with-photo waiting-row" style="grid-template-columns: 52px 1fr;">
                <img class="thumb" src="${esc(p.img)}" alt="">
                <div>
                  <h3>${esc(r.property)}</h3>
                  <div class="meta">
                    <span class="wait-pill">Waiting (${Number(r.voted) || 0} of 4)</span>
                    ${viewLink(r.property)}
                  </div>
                </div>
              </article>`;
          }
          const agr = r.agreement === 'agreed' ? 'agreed' : 'split';
          const fp = Number(r.first_place_count) || 0;
          const db = Number(r.deal_breaker_count) || 0;
          return `
              <article class="card place with-photo">
                <img class="thumb" src="${esc(p.img)}" alt="">
                <div>
                  <h3>${esc(r.property)}</h3>
                  <div class="meta">
                    <span class="badge ${agr}">${agr === 'agreed' ? 'Agreed' : 'Split'}</span>
                    <span>${fp} first-place pick${fp === 1 ? '' : 's'}</span>
                    <span>${db} deal breaker${db === 1 ? '' : 's'}</span>
                    <span>${Number(r.voted) || 0} of 4 rated</span>
                  </div>
                </div>
                <div class="score">${esc(fmtScore(r.avg_score))}</div>
              </article>`;
        }).join('')}</div>`}`;
    }

    function renderBoot() {
      return `
        <header class="top"><h1>Tampa Tour Vote</h1></header>
        ${state.bootError
          ? `<div class="card intro"><h2>Couldn't load.</h2><p>${esc(state.bootError)}</p><button class="primary" data-act="retry">Try again</button></div>`
          : `<p class="loading">Loading…</p>`}`;
    }

    function render() {
      const auth = state.phase === 'claim' || state.phase === 'claimed' || state.phase === 'enter' || state.phase === 'boot';
      document.body.classList.toggle('auth', auth);
      tabs.classList.toggle('hidden', auth);

      let body = '';
      if (state.phase === 'boot') body = renderBoot();
      else if (state.phase === 'claim') body = renderClaim();
      else if (state.phase === 'claimed') body = renderClaimed();
      else if (state.phase === 'enter') body = renderEnter();
      else if (state.screen === 'rate') body = renderRate();
      else if (state.screen === 'compare') body = renderCompare();
      else if (state.tab === 'mine') body = renderMine();
      else if (state.tab === 'group') body = renderGroup();
      else body = renderHome();

      app.innerHTML = body;
      if (state.busy) app.classList.add('busy-note');
      else app.classList.remove('busy-note');

      tabs.querySelectorAll('button[data-tab]').forEach((b) => {
        b.classList.toggle('active', b.dataset.tab === state.tab && state.screen === 'home');
      });

      const input = document.getElementById('code-in');
      if (input && state.phase === 'enter' && !isLocked()) {
        input.addEventListener('input', () => {
          const v = normalizeCode(input.value);
          if (input.value !== v) input.value = v;
          state.enterValue = v;
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') document.querySelector('[data-act="submit-enter"]')?.click();
        });
      }
    }

    async function doClaim() {
      if (state.busy) return;
      state.busy = true;
      render();
      try {
        const data = await api('claim_code');
        if (data && data.ok && data.code) {
          saveCode(data.code);
          clearFails();
          state.remaining = data.remaining;
          state.myList = [];
          state.phase = 'claimed';
        } else {
          state.remaining = data && data.remaining != null ? data.remaining : 0;
          state.enterError = (data && data.message) || 'All 4 codes are already assigned. Enter your code if you have one.';
          state.phase = 'enter';
        }
      } catch (err) {
        toast(rpcMessage(err));
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doEnter() {
      if (state.busy || isLocked()) return;
      const v = normalizeCode(document.getElementById('code-in')?.value || state.enterValue);
      state.enterValue = v;
      if (v.length !== 2) {
        state.enterError = 'Enter the 2-letter code you were given.';
        render();
        return;
      }
      state.busy = true;
      state.enterError = '';
      render();
      try {
        const data = await api('enter_code', { voter_code: v, client_key: state.clientKey });
        if (isFail(data) || !data || !data.ok) {
          const locked = !!(data && data.locked);
          recordFail(locked);
          state.enterError = (data && data.error) || "That code isn't recognized.";
          if (isLocked()) {
            state.enterError = 'Too many wrong codes. Please wait an hour and try again.';
          }
        } else {
          saveCode(data.code || v);
          clearFails();
          await refreshMine();
          state.phase = 'app';
          state.tab = 'vote';
          state.screen = 'home';
        }
      } catch (err) {
        state.enterError = rpcMessage(err);
      } finally {
        state.busy = false;
        render();
      }
    }

    async function finishRate() {
      const place = state.ratePlace;
      const tier = state.rateTier;
      const deal = !!state.rateDeal;
      if (!place || !tier) return;
      const existing = mineByName(place);
      // Same band already on the list: keep order, just update deal breaker.
      if (existing && existing.tier === tier) {
        const next = state.myList.map((r) => r.property === place ? { ...r, deal_breaker: deal } : r);
        state.busy = true;
        render();
        try {
          await submitList(next);
          toast('Saved.');
          state.screen = 'home';
          state.tab = 'mine';
          state.editing = place;
        } catch (err) {
          toast(rpcMessage(err));
        } finally {
          state.busy = false;
          state.compare = null;
          render();
        }
        return;
      }
      const band = bandOf(state.myList, tier, place);
      const item = { property: place, tier, deal_breaker: deal };
      if (band.length >= 1) {
        // comparisons — insertIntoBand switches to compare screen
        try {
          const newBand = await insertIntoBand(item, band);
          state.compare = null;
          state.screen = 'home';
          state.busy = true;
          render();
          const next = stitch(state.myList, newBand, tier, place);
          await submitList(next);
          toast('Saved.');
          state.tab = 'mine';
          state.editing = null;
        } catch (err) {
          toast(rpcMessage(err));
          state.screen = 'rate';
        } finally {
          state.busy = false;
          state.compare = null;
          render();
        }
        return;
      }
      state.busy = true;
      render();
      try {
        const next = stitch(state.myList, [item], tier, place);
        await submitList(next);
        toast('Saved.');
        state.screen = 'home';
        state.tab = 'mine';
        state.editing = null;
      } catch (err) {
        toast(rpcMessage(err));
      } finally {
        state.busy = false;
        render();
      }
    }

    async function applyEdit(mutator) {
      if (state.busy) return;
      const prev = state.myList.slice();
      const next = mutator(state.myList.slice());
      if (!next) return;
      state.busy = true;
      render();
      try {
        await submitList(next);
      } catch (err) {
        state.myList = prev;
        toast(rpcMessage(err));
      } finally {
        state.busy = false;
        render();
      }
    }

    function move(name, dir) {
      return applyEdit((list) => {
        const i = list.findIndex((r) => r.property === name);
        const j = i + dir;
        if (i < 0 || j < 0 || j >= list.length) return null;
        if (list[i].tier !== list[j].tier) return null;
        const tmp = list[i];
        list[i] = list[j];
        list[j] = tmp;
        return list;
      });
    }

    function setTier(name, tier) {
      return applyEdit((list) => {
        const row = list.find((r) => r.property === name);
        if (!row || row.tier === tier) return null;
        const rest = list.filter((r) => r.property !== name);
        const item = { ...row, tier };
        // Place at the bottom of the new band; user can move up.
        const liked = item.tier === 'liked' ? [...bandOf(rest, 'liked'), item] : bandOf(rest, 'liked');
        const fine = item.tier === 'fine' ? [...bandOf(rest, 'fine'), item] : bandOf(rest, 'fine');
        const didnt = item.tier === 'didnt_like' ? [...bandOf(rest, 'didnt_like'), item] : bandOf(rest, 'didnt_like');
        return [...liked, ...fine, ...didnt];
      });
    }

    function setDeal(name, on) {
      return applyEdit((list) => list.map((r) => r.property === name ? { ...r, deal_breaker: on } : r));
    }

    app.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'do-claim') doClaim();
      else if (act === 'go-enter') { state.phase = 'enter'; state.enterError = ''; render(); }
      else if (act === 'go-claim') { state.phase = 'claim'; render(); }
      else if (act === 'go-home') { state.phase = 'app'; state.tab = 'vote'; state.screen = 'home'; render(); }
      else if (act === 'go-vote') { state.tab = 'vote'; state.screen = 'home'; render(); }
      else if (act === 'copy') {
        navigator.clipboard.writeText(state.code).then(() => toast('Code copied.')).catch(() => toast('Copy failed — remember ' + state.code + '.'));
      }
      else if (act === 'submit-enter') doEnter();
      else if (act === 'retry') init();
      else if (act === 'rate') {
        state.ratePlace = btn.dataset.name;
        const existing = mineByName(state.ratePlace);
        state.rateTier = existing ? existing.tier : null;
        state.rateDeal = existing ? !!existing.deal_breaker : false;
        state.screen = 'rate';
        state.tab = 'vote';
        render();
      }
      else if (act === 'pick-tier') { state.rateTier = btn.dataset.tier; render(); }
      else if (act === 'next-rate') finishRate();
      else if (act === 'cancel-rate') { state.screen = 'home'; render(); }
      else if (act === 'prefer') {
        const c = state.compare;
        if (!c) return;
        const preferA = btn.dataset.pick === 'a';
        const resolve = c.resolve;
        state.compare = { ...c, resolve: null };
        resolve(preferA);
      }
      else if (act === 'edit') { state.editing = btn.dataset.name; render(); }
      else if (act === 'close-edit') { state.editing = null; render(); }
      else if (act === 'set-tier') setTier(btn.dataset.name, btn.dataset.tier);
      else if (act === 'up') move(btn.dataset.name, -1);
      else if (act === 'down') move(btn.dataset.name, 1);
    });

    // Checkbox change (click on label may also fire click)
    app.addEventListener('change', (e) => {
      const el = e.target.closest('[data-act="edit-deal"], [data-act="deal"]');
      if (!el) return;
      if (el.dataset.act === 'edit-deal') setDeal(el.dataset.name, !!el.checked);
      if (el.dataset.act === 'deal') state.rateDeal = !!el.checked;
    });

    tabs.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn || state.phase !== 'app') return;
      state.tab = btn.dataset.tab;
      state.screen = 'home';
      if (state.tab === 'group') {
        try { await refreshGroup(); } catch (err) { toast(rpcMessage(err)); }
      }
      if (state.tab === 'mine') {
        try { await refreshMine(); } catch (err) { toast(rpcMessage(err)); }
      }
      render();
    });

    async function init() {
      state.phase = 'boot';
      state.bootError = '';
      state.clientKey = clientKey();
      state.code = normalizeCode(localStorage.getItem(CODE_KEY) || '');
      state.fails = Number(localStorage.getItem(FAILS_KEY) || 0) || 0;
      state.lockedUntil = Number(localStorage.getItem(LOCK_KEY) || 0) || 0;
      render();
      try {
        const status = await api('claim_status');
        state.remaining = status && status.remaining != null ? status.remaining : null;
        if (state.code) {
          try {
            await refreshMine();
            state.phase = 'app';
            state.tab = 'vote';
            state.screen = 'home';
          } catch (err) {
            // Saved code failed (lockout or rejected). Fall back to enter.
            if (isLocked()) {
              state.phase = 'enter';
              state.enterError = 'Too many wrong codes. Please wait an hour and try again.';
            } else {
              // Keep the saved code off the "new device" claim path if it's invalid?
              // If get_my_list failed for a network reason, don't wipe the code.
              const msg = rpcMessage(err);
              if (/recognized|wrong code|isn't recognized/i.test(msg)) {
                localStorage.removeItem(CODE_KEY);
                state.code = '';
                state.phase = state.remaining === 0 ? 'enter' : 'claim';
              } else if (/too many wrong/i.test(msg)) {
                state.phase = 'enter';
                state.lockedUntil = Date.now() + LOCK_MS;
                persistLock();
              } else {
                state.bootError = msg;
                state.phase = 'boot';
              }
            }
          }
        } else if (state.remaining === 0 || isLocked()) {
          state.phase = 'enter';
        } else {
          state.phase = 'claim';
        }
      } catch (err) {
        state.bootError = rpcMessage(err);
        state.phase = 'boot';
      }
      render();
    }

    init();
  </script>
</body>
</html>
